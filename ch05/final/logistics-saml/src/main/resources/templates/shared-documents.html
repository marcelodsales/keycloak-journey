<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partner Documents - Mediterranean Logistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #eef2f7; }
      .top-header { background-color: #0d3b66; color: #ffffff; padding: 0.6rem 1.5rem; font-size: 0.85rem; }
      .main-nav { background-color: #ffffff; border-bottom: 3px solid #f4845f; padding: 0.5rem 1.5rem; }
      .main-nav .brand { font-size: 1.2rem; font-weight: 700; color: #0d3b66; }
      .main-nav .nav-link { color: #495057; font-weight: 500; padding: 0.5rem 1rem; }
      .main-nav .nav-link.active { color: #0d3b66; border-bottom: 2px solid #f4845f; }
    </style>
</head>
<body>
    <div class="top-header d-flex justify-content-between align-items-center">
      <span>Mediterranean Logistics - Supply Chain Management</span>
      <div class="d-flex align-items-center">
        <span th:if="${name != null}" class="me-3" th:text="${name}">User</span>
        <form th:if="${name != null}" th:action="@{/logout}" method="post" class="d-inline">
          <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
      </div>
    </div>

    <div class="main-nav d-flex align-items-center">
      <span class="brand me-4">Logistics</span>
      <nav class="nav">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/tracking">Tracking</a>
        <a class="nav-link" href="/costs">Costs</a>
        <a class="nav-link active" href="/shared-documents">Partner Documents</a>
      </nav>
    </div>

    <div class="container-fluid p-4">
      <div class="card shadow-sm">
        <div class="card-header bg-white"><h6 class="mb-0 fw-semibold">Shared Partner Documents</h6></div>
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr><th class="ps-4">ID</th><th>Document</th><th>Format</th></tr>
            </thead>
            <tbody>
              <tr th:each="d : ${documents}">
                <td class="ps-4"><code th:text="${d.id()}"></code></td>
                <td th:text="${d.name()}"></td>
                <td><span class="badge bg-secondary" th:text="${d.format()}"></span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
</body>
</html>
