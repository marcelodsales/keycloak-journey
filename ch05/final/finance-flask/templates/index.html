<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mediterranean Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #f4f6f9; }
      .sidebar { min-height: 100vh; background-color: #1a2332; }
      .sidebar .nav-link { color: #8899aa; font-size: 0.9rem; padding: 0.7rem 1.2rem; }
      .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #ffffff; background-color: #243447; }
      .sidebar .brand { color: #ffffff; font-size: 1.1rem; font-weight: 600; padding: 1.2rem; border-bottom: 1px solid #243447; }
      .topbar { background-color: #ffffff; border-bottom: 1px solid #dee2e6; padding: 0.8rem 1.5rem; }
      .kpi-card { border: none; border-left: 4px solid; }
      .kpi-card.revenue { border-left-color: #0d6efd; }
      .kpi-card.expenses { border-left-color: #dc3545; }
      .kpi-card.pending { border-left-color: #ffc107; }
      .kpi-value { font-size: 1.6rem; font-weight: 700; color: #1a2332; }
      .kpi-label { font-size: 0.8rem; color: #6c757d; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div class="sidebar d-flex flex-column" style="width: 240px;">
        <div class="brand">Mediterranean Finance</div>
        <nav class="nav flex-column mt-2">
          <a class="nav-link active" href="/">Dashboard</a>
          <a class="nav-link" href="/reports">Financial Reports</a>
          <a class="nav-link" href="/transactions">Transactions</a>
        </nav>
      </div>

      <div class="flex-grow-1">
        <div class="topbar d-flex justify-content-between align-items-center">
          <span class="text-muted">Dashboard</span>
          <div>
            {% if user %}
              <span class="me-3">{{ user.name }}</span>
              <form action="/logout" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
              </form>
            {% else %}
              <span class="text-muted me-3">Not logged in</span>
              <a href="/login" class="btn btn-primary btn-sm">Login</a>
            {% endif %}
          </div>
        </div>

        <div class="p-4">
          <div class="row g-4 mb-4">
            <div class="col-md-4">
              <div class="card kpi-card revenue shadow-sm">
                <div class="card-body">
                  <div class="kpi-label">Revenue YTD</div>
                  <div class="kpi-value">$2.4M</div>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card kpi-card expenses shadow-sm">
                <div class="card-body">
                  <div class="kpi-label">Expenses YTD</div>
                  <div class="kpi-value">$1.8M</div>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card kpi-card pending shadow-sm">
                <div class="card-body">
                  <div class="kpi-label">Pending Approvals</div>
                  <div class="kpi-value">7</div>
                </div>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="mb-0 fw-semibold">Quick Access</h6>
            </div>
            <div class="card-body">
              <p class="text-muted mb-3">Access financial reports and documents.</p>
              <a href="/reports" class="btn btn-primary btn-sm">View Reports</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
