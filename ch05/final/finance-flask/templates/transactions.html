<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transactions - Mediterranean Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #f4f6f9; }
      .sidebar { min-height: 100vh; background-color: #1a2332; }
      .sidebar .nav-link { color: #8899aa; font-size: 0.9rem; padding: 0.7rem 1.2rem; }
      .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #ffffff; background-color: #243447; }
      .sidebar .brand { color: #ffffff; font-size: 1.1rem; font-weight: 600; padding: 1.2rem; border-bottom: 1px solid #243447; }
      .topbar { background-color: #ffffff; border-bottom: 1px solid #dee2e6; padding: 0.8rem 1.5rem; }
      .amount-positive { color: #198754; }
      .amount-negative { color: #dc3545; }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div class="sidebar d-flex flex-column" style="width: 240px;">
        <div class="brand">Mediterranean Finance</div>
        <nav class="nav flex-column mt-2">
          <a class="nav-link" href="/">Dashboard</a>
          <a class="nav-link" href="/reports">Financial Reports</a>
          <a class="nav-link active" href="/transactions">Transactions</a>
        </nav>
      </div>

      <div class="flex-grow-1">
        <div class="topbar d-flex justify-content-between align-items-center">
          <span class="text-muted">Transactions</span>
          <div>
            {% if user %}
              <span class="me-3">{{ user.name }}</span>
              <form action="/logout" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
              </form>
            {% else %}
              <span class="text-muted me-3">Not logged in</span>
              <a href="/login" class="btn btn-primary btn-sm">Login</a>
            {% endif %}
          </div>
        </div>

        <div class="p-4">
          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <h6 class="mb-0 fw-semibold">Recent Transactions</h6>
            </div>
            <div class="card-body p-0">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="ps-4">ID</th>
                    <th>Description</th>
                    <th class="pe-4 text-end">Amount</th>
                  </tr>
                </thead>
                <tbody>
                  {% for t in transactions %}
                  <tr>
                    <td class="ps-4"><code>{{ t.id }}</code></td>
                    <td>{{ t.description }}</td>
                    <td class="pe-4 text-end {% if t.amount >= 0 %}amount-positive{% else %}amount-negative{% endif %}">
                      ${{ "{:,.2f}".format(t.amount) }}
                    </td>
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
