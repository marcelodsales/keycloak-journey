<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mediterranean Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand">Mediterranean Digital</span>
        <div class="navbar-nav ms-auto align-items-center">
          <span id="greeting" class="navbar-text me-3">Not logged in</span>
          <button id="loginBtn" class="btn btn-outline-light btn-sm" type="button">Login</button>
          <button id="logoutBtn" class="btn btn-outline-danger btn-sm" type="button" style="display:none">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div id="pricingSection" class="card mb-3" style="display:none">
        <div class="card-header bg-warning-subtle">
          <h5 class="mb-0">Pricing Dashboard</h5>
        </div>
        <div class="card-body">
          <p class="text-muted mb-0">Revenue: $12,450.00 | Avg price: $15.49 | Items below margin: 3</p>
        </div>
      </div>

      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Product Catalog</h5>
          <button id="loadProducts" class="btn btn-primary btn-sm" type="button">Load Products</button>
        </div>
        <div class="card-body">
          <div id="product-table"></div>
          <p id="empty-state" class="text-muted">Click <strong>Load Products</strong> to fetch the catalog from the API.</p>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
