<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mediterranean Logistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #eef2f7; }
      .top-header { background-color: #0d3b66; color: #ffffff; padding: 0.6rem 1.5rem; font-size: 0.85rem; }
      .main-nav { background-color: #ffffff; border-bottom: 3px solid #f4845f; padding: 0.5rem 1.5rem; }
      .main-nav .brand { font-size: 1.2rem; font-weight: 700; color: #0d3b66; }
      .main-nav .nav-link { color: #495057; font-weight: 500; padding: 0.5rem 1rem; }
      .main-nav .nav-link.active { color: #0d3b66; border-bottom: 2px solid #f4845f; }
      .stat-bar { background-color: #ffffff; border-bottom: 1px solid #dee2e6; padding: 1rem 1.5rem; }
      .stat-item { text-align: center; }
      .stat-value { font-size: 1.8rem; font-weight: 700; }
      .stat-value.blue { color: #0d3b66; }
      .stat-value.orange { color: #f4845f; }
      .stat-value.green { color: #2d936c; }
      .stat-value.red { color: #c1292e; }
      .stat-label { font-size: 0.75rem; color: #6c757d; text-transform: uppercase; letter-spacing: 0.08em; }
      .badge-transit { background-color: #f4845f; }
      .badge-delivered { background-color: #2d936c; }
      .badge-hold { background-color: #c1292e; }
    </style>
</head>
<body>
    <div class="top-header d-flex justify-content-between align-items-center">
      <span>Mediterranean Logistics - Supply Chain Management</span>
      <div class="d-flex align-items-center">
        <span th:if="${name != null}" class="me-3" th:text="${name}">User</span>
        <span th:if="${name == null}" class="me-3">Not logged in</span>
        <form th:if="${name != null}" th:action="@{/logout}" method="post" class="d-inline">
          <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
      </div>
    </div>

    <div class="main-nav d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <span class="brand me-4">Logistics</span>
        <nav class="nav">
          <a class="nav-link active" href="/">Shipments</a>
          <a class="nav-link disabled" href="#">Routes</a>
          <a class="nav-link disabled" href="#">Partners</a>
        </nav>
      </div>
    </div>

    <div class="stat-bar d-flex justify-content-around">
      <div class="stat-item">
        <div class="stat-value blue" th:text="${#lists.size(shipments)}">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-item">
        <div class="stat-value orange">1</div>
        <div class="stat-label">In Transit</div>
      </div>
      <div class="stat-item">
        <div class="stat-value green">1</div>
        <div class="stat-label">Delivered</div>
      </div>
      <div class="stat-item">
        <div class="stat-value red">1</div>
        <div class="stat-label">Customs Hold</div>
      </div>
    </div>

    <div class="container-fluid p-4">
      <div class="card shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-4">Tracking ID</th>
                <th>Origin</th>
                <th>Destination</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="s : ${shipments}">
                <td class="ps-4 fw-semibold"><code th:text="${s.id()}"></code></td>
                <td th:text="${s.origin()}"></td>
                <td th:text="${s.destination()}"></td>
                <td>
                  <span th:if="${s.status() == 'In Transit'}" class="badge badge-transit" th:text="${s.status()}"></span>
                  <span th:if="${s.status() == 'Delivered'}" class="badge badge-delivered" th:text="${s.status()}"></span>
                  <span th:if="${s.status() == 'Customs Hold'}" class="badge badge-hold" th:text="${s.status()}"></span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
</body>
</html>
