<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Noto Serif, DejaVu Serif, Georgia, serif" font-size="14" fill="#333333">

  <!-- Applications -->
  <rect x="20" y="10" width="860" height="80" rx="6" fill="#FFFFFF" stroke="#2D3748" stroke-width="1"/>
  <text x="450" y="30" text-anchor="middle" font-size="13" fill="#6c757d">Applications</text>

  <rect x="40" y="38" width="200" height="44" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="140" y="56" text-anchor="middle" font-size="12">digital-frontend</text>
  <text x="140" y="72" text-anchor="middle" font-size="12">digital-backend (OIDC)</text>

  <rect x="350" y="38" width="200" height="44" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="450" y="64" text-anchor="middle" font-size="12">med-finance (OIDC)</text>

  <rect x="660" y="38" width="200" height="44" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="760" y="64" text-anchor="middle" font-size="12">med-logistics (SAML)</text>

  <!-- HTTPS arrows -->
  <line x1="140" y1="90" x2="140" y2="160" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="130" font-size="11" fill="#2D3748">HTTPS</text>

  <line x1="450" y1="90" x2="450" y2="160" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="130" font-size="11" fill="#2D3748">HTTPS</text>

  <line x1="760" y1="90" x2="760" y2="160" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="775" y="130" font-size="11" fill="#2D3748">HTTPS</text>

  <!-- VM 1: kc-digital -->
  <rect x="30" y="155" width="250" height="120" rx="6" fill="#E2EFEF" stroke="#C53030" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="155" y="175" text-anchor="middle" font-size="12" font-weight="bold">VM: kc-digital</text>
  <rect x="50" y="185" width="210" height="32" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="155" y="206" text-anchor="middle" font-size="12">HAProxy :443</text>
  <line x1="155" y1="217" x2="155" y2="230" stroke="#2D3748" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="50" y="228" width="210" height="32" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="155" y="249" text-anchor="middle" font-size="12">Keycloak :8443</text>

  <!-- VM 2: kc-finance -->
  <rect x="325" y="155" width="250" height="120" rx="6" fill="#E8EEF4" stroke="#C53030" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="450" y="175" text-anchor="middle" font-size="12" font-weight="bold">VM: kc-finance</text>
  <rect x="345" y="185" width="210" height="32" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="450" y="206" text-anchor="middle" font-size="12">HAProxy :443</text>
  <line x1="450" y1="217" x2="450" y2="230" stroke="#2D3748" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="345" y="228" width="210" height="32" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="450" y="249" text-anchor="middle" font-size="12">Keycloak :8443</text>

  <!-- VM 3: kc-logistics -->
  <rect x="620" y="155" width="250" height="120" rx="6" fill="#EAF2E8" stroke="#C53030" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="745" y="175" text-anchor="middle" font-size="12" font-weight="bold">VM: kc-logistics</text>
  <rect x="640" y="185" width="210" height="32" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="745" y="206" text-anchor="middle" font-size="12">HAProxy :443</text>
  <line x1="745" y1="217" x2="745" y2="230" stroke="#2D3748" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="640" y="228" width="210" height="32" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="745" y="249" text-anchor="middle" font-size="12">Keycloak :8443</text>

  <!-- DB arrows -->
  <line x1="155" y1="275" x2="155" y2="368" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="275" x2="450" y2="368" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="745" y1="275" x2="745" y2="368" stroke="#2D3748" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DB VM 1 -->
  <rect x="45" y="365" width="220" height="60" rx="6" fill="#FFF3E0" stroke="#2D3748" stroke-width="1"/>
  <text x="155" y="383" text-anchor="middle" font-size="11" fill="#6c757d">DB VM: Digital</text>
  <rect x="65" y="392" width="180" height="26" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="155" y="410" text-anchor="middle" font-size="11">PostgreSQL 18</text>

  <!-- DB VM 2 -->
  <rect x="340" y="365" width="220" height="60" rx="6" fill="#FFF3E0" stroke="#2D3748" stroke-width="1"/>
  <text x="450" y="383" text-anchor="middle" font-size="11" fill="#6c757d">DB VM: Finance</text>
  <rect x="360" y="392" width="180" height="26" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="450" y="410" text-anchor="middle" font-size="11">PostgreSQL 18</text>

  <!-- DB VM 3 -->
  <rect x="635" y="365" width="220" height="60" rx="6" fill="#FFF3E0" stroke="#2D3748" stroke-width="1"/>
  <text x="745" y="383" text-anchor="middle" font-size="11" fill="#6c757d">DB VM: Logistics</text>
  <rect x="655" y="392" width="180" height="26" rx="4" fill="#E8EEF4" stroke="#2D3748" stroke-width="1"/>
  <text x="745" y="410" text-anchor="middle" font-size="11">PostgreSQL 18</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D3748"/>
    </marker>
  </defs>
</svg>
