<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports - Mediterranean Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand">Mediterranean Finance</span>
        <div class="navbar-nav ms-auto align-items-center">
          <span class="navbar-text me-3">Not logged in</span>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Financial Reports</h5>
          <a href="/" class="btn btn-secondary btn-sm">Back</a>
        </div>
        <div class="card-body">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-light">
              <tr><th>ID</th><th>Description</th><th>Status</th></tr>
            </thead>
            <tbody>
              {% for r in reports %}
              <tr>
                <td>{{ r.id }}</td>
                <td>{{ r.description }}</td>
                <td><span class="badge bg-secondary">{{ r.status }}</span></td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
