server:
  port: 8082

spring:
  security:
    saml2:
      relyingparty:
        registration:
          keycloak:
            entity-id: med-logistics
            assertingparty:
              metadata-uri: http://localhost:8080/realms/mediterranean/protocol/saml/descriptor
              singlesignon:
                sign-request: false
            acs:
              location: "{baseUrl}/login/saml2/sso/{registrationId}"

logging:
  level:
    org.springframework.security: TRACE
